[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-assist"
version = "1.0.0"
description = "Agent de qualification, validation humaine et suivi des tickets IT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Mehdi Benjelloun"}, {name = "Oussama Kamil"}]
dependencies = [
  "scikit-learn>=1.5,<1.6", "numpy>=1.26,<3", "joblib>=1.4,<2",
  "fastapi>=0.115,<0.116", "uvicorn>=0.30,<0.31", "pydantic>=2.9,<3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.39,<1.40", "httpx>=0.27,<0.28", "pandas>=2.2,<3"]

[project.scripts]
ticket = "ticket_agent.cli:main"

[tool.setuptools]
packages = ["ticket_agent", "api", "ui"]

[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pandas.*", "streamlit.*", "uvicorn.*"]
ignore_missing_imports = true
[tool.coverage.report]
show_missing = true
skip_empty = true
