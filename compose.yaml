services:
  api:
    build: .
    env_file: .env
    environment:
      TICKET_DB: /app/var/tickets.sqlite3
      TICKET_MODEL: /app/models/tickets.joblib
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tickets:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
  ui:
    build: .
    command: ["ticket", "ui"]
    environment:
      TICKET_API_URL: http://api:8000
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  tickets:
